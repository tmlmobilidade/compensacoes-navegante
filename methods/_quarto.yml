project:
  type: book
  output-dir: _book

lang: pt

book:
  title: "Passe Navegante"
  subtitle: "Receitas e Compensações - Procedimento e Metodologia de Cálculo"
  author: 
    - name: "TML — Transportes Metropolitanos de Lisboa"
    - name: "Departamento de Estudos e Planeamento"
  date: last-modified
  chapters:
    - index.qmd
    - part: "**Cálculos**"
      chapters:
        - 01_passageiros.qmd
        - 02_distancias_quotas.qmd
        - 03_vendas.qmd
        - 04_reparticao_congelamento.qmd
        - 05_cosp.qmd
        - 06_transferencias_tabelas.qmd
    - part: "**Documentos**"
      chapters:
        - 07_documentos.qmd
    - part: "**Anexos**"
      chapters:
        - anexo_tabelas.qmd
        - anexo_execucao.qmd

format:
  html:
    theme:
      light: cosmo
    toc: true
    toc-depth: 3
    toc-title: "Nesta página"
    number-sections: true
    smooth-scroll: true
    code-copy: true
    code-fold: show
    code-overflow: wrap
    html-math-method: mathjax

repo-url: https://github.com/tmlmobilidade/compensacoes-navegante