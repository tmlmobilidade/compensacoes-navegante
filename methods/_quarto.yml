project:
  type: book
  output-dir: _book

lang: pt

book:
  title: "Compensações Passe Navegante"
  subtitle: "Receitas e Compensações - Procedimento e Metodologia de Apuramento Provisório Mensal"
  author: 
    - name: "TML - Transportes Metropolitanos de Lisboa"
    - name: "Departamento de Estudos e Planeamento"
  date: last-modified
  chapters:
    - index.qmd
    - part: "**Cálculos**"
      chapters:
        - 01_passageiros.qmd
        - 02_distancias_quotas.qmd
        - 03_vendas.qmd
        - 04_reparticao_congelamento.qmd
        - 05_cosp.qmd
        - 06_transferencias_tabelas.qmd
    - part: "**Documentos**"
      chapters:
        - 07_documentos.qmd
    - part: "**Anexos**"
      chapters:
        - anexo_execucao.qmd
        - anexo_tabelas.qmd
        - references.qmd

  repo-url: https://github.com/tmlmobilidade/compensacoes-navegante
  site-url: https://tmlmobilidade.github.io/compensacoes-navegante

  page-footer:
    left: "TML - Transportes Metropolitanos de Lisboa"
    # center: "DEP - Departamento de Estudos e Planeamento"
    right: "v0.3 (beta)"

bibliography: references.bib
link-citations: true
citeproc: true 

format:
  html:
    theme:
      light: cosmo
    filters:
      - filters/resolve-repo-links.lua
    toc: true
    toc-depth: 3
    # toc-expand: true
    toc-title: "Nesta página"
    number-sections: true
    smooth-scroll: true
    code-copy: true
    code-fold: show
    code-overflow: wrap
    html-math-method: mathjax
